name: read shielded claims

# Every 5 minutes (GitHub may run it a little later under load), plus a manual button.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: reader
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVTOOL_REV: 5a26ee854e634a4e88d1d79dab13f8fbb1eac6b8   # pinned zcash-devtool commit (library, not our code)

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore zcash-devtool build
        id: tool
        uses: actions/cache/restore@v4
        with:
          path: ~/bin/zcash-devtool
          key: devtool-${{ env.DEVTOOL_REV }}

      - name: Build zcash-devtool (first run only)
        if: steps.tool.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          git clone https://github.com/zcash/zcash-devtool /tmp/devtool
          cd /tmp/devtool && git checkout "$DEVTOOL_REV"
          cargo build --release
          mkdir -p ~/bin && cp target/release/zcash-devtool ~/bin/

      - name: Save zcash-devtool build
        if: steps.tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bin/zcash-devtool
          key: devtool-${{ env.DEVTOOL_REV }}

      - name: Restore view-only wallet
        uses: actions/cache/restore@v4
        with:
          path: hw_wallet
          key: wallet-${{ github.run_id }}
          restore-keys: wallet-

      - name: Read the chain
        env:
          DEVTOOL: ~/bin/zcash-devtool
          WALLET_DIR: hw_wallet
          HW_UFVK: ${{ secrets.HW_UFVK }}
          HW_BIRTHDAY: ${{ secrets.HW_BIRTHDAY }}
          HW_ANSWERS: ${{ secrets.HW_ANSWERS }}
          HW_DROPS: ${{ secrets.HW_DROPS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: DEVTOOL=$HOME/bin/zcash-devtool python3 reader/read_claims.py

      - name: Save view-only wallet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hw_wallet
          key: wallet-${{ github.run_id }}
